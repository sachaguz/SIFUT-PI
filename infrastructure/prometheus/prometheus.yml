global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sifut-api-private'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-private:3001']
        labels:
          instance: 'api-private'

  # api-1/api-2 are the instances that actually serve real traffic
  # (nginx load-balances /api/ to them, never to api-private) - scrape
  # them directly over the internal Docker network so their counters
  # (not api-private's, which never sees a real user request) are what
  # shows up in Grafana.
  - job_name: 'sifut-api-1'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-1:3000']
        labels:
          instance: 'api-1'

  - job_name: 'sifut-api-2'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-2:3000']
        labels:
          instance: 'api-2'

  - job_name: 'nginx'
    metrics_path: /nginx_status
    static_configs:
      - targets: ['nginx:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'firewall'
    static_configs:
      - targets: ['node-exporter:9100']
