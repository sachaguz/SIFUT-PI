worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Backend API upstream (load balancer - round robin).
    # NOTE: nginx resolves these hostnames once at startup. If you rebuild
    # only api-1/api-2 (not nginx), they get new container IPs and nginx
    # keeps talking to the old ones -> 502. Always run
    # `docker compose up -d --build` for ALL services (or at least
    # `docker compose restart nginx` after rebuilding any backend service).
    upstream api_backend {
        server api-1:3000;
        server api-2:3000;
    }

    # Docker's embedded DNS resolver, used below so admin-panel and
    # api-private are re-resolved on every request instead of being
    # cached for the life of the nginx process (avoids the same 502
    # issue described above for these two single-instance services).
    resolver 127.0.0.11 valid=10s;

    # Redirect HTTP to HTTPS (except the ACME HTTP-01 challenge path,
    # needed once to issue a real Let's Encrypt cert - see
    # infrastructure/ssl/README.md).
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Public API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stricter rate limit on login
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://api_backend;
        }

        # Admin web app (React Native Web export of the admin screens).
        # Served at the domain root: the Expo web build emits root-absolute
        # asset paths (/_expo/..., /favicon.ico), so serving it under a
        # /admin/ subpath would 404 those assets unless every path were
        # rewritten. Root-level serving matches Expo's default output as-is.
        location / {
            set $admin_host admin-panel;
            proxy_pass http://$admin_host:80$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Internal: Prometheus scraping (not exposed externally)
    server {
        listen 8080;
        server_name _;

        # Nginx metrics stub
        location /nginx_status {
            stub_status;
            allow 172.16.0.0/12;
            deny all;
        }

        # Proxy to private API metrics
        location /metrics {
            set $private_upstream api-private:3001;
            proxy_pass http://$private_upstream/metrics;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
